<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Purificación de Agua</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e3f2fd;

    header {
      background: #007acc;
